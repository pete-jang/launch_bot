name: Deploy to Cloudtype

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: pete.jang/launch-bot
          stage: main
          yaml: |
            name: launch-bot
            app: node@20
            options:
              env:
                - name: SLACK_BOT_TOKEN
                  secret: slack-bot-token
                - name: SLACK_APP_TOKEN
                  secret: slack-app-token
                - name: SLACK_SIGNING_SECRET
                  secret: slack-signing-secret
                - name: SLACK_CHANNEL_ID
                  secret: slack-channel-id
                - name: SLACK_ADMIN_IDS
                  value: U08MNHQFG0J
                - name: DB_HOST
                  secret: db-host
                - name: DB_PORT
                  secret: db-port
                - name: DB_USER
                  secret: db-user
                - name: DB_PASSWORD
                  secret: db-password
                - name: DB_NAME
                  secret: db-name
                - name: LUNCHLAB_USERNAME
                  secret: lunchlab-username
                - name: LUNCHLAB_PASSWORD
                  secret: lunchlab-password
                - name: LUNCHLAB_BASE_URL
                  value: https://b2b.lunchlab.me
                - name: TZ
                  value: Asia/Seoul
              build: npm run build
              start: npm start
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
